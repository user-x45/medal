<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Wikipedia 検索</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwindのダークモード（CSSのメディアクエリ連動）設定
        tailwind.config = {
            darkMode: 'media',
        }
    </script>
    <!-- Font Awesome (v6) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* カスタムスクロールバーとアニメーション */
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- ヘッダー -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-10 shadow-sm transition-colors duration-200">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <!-- ロゴ -->
            <div class="flex items-center gap-2 cursor-pointer" id="logoBtn">
                <div class="bg-indigo-600 text-white p-2.5 rounded-lg shadow-md flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-book-open text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">WikiSearch</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Wikipedia 検索アプリ</p>
                </div>
            </div>

            <!-- 検索バー（ヘッダー部） -->
            <div class="w-full sm:w-auto flex-1 max-w-md">
                <form id="searchForm" class="relative">
                    <!-- iOS自動ズーム防止のため text-base (16px) を保持 -->
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Wikipedia内を検索..." 
                        class="w-full pl-10 pr-10 py-2 bg-slate-100 hover:bg-slate-200/60 dark:bg-slate-700 dark:hover:bg-slate-600/80 focus:bg-white dark:focus:bg-slate-800 rounded-full border border-transparent focus:border-indigo-500 dark:focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 dark:focus:ring-indigo-950 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-400 transition duration-200 text-base"
                        required
                    />
                    <i class="fa-solid fa-magnifying-glass text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 text-sm"></i>
                    <button 
                        type="button" 
                        id="clearBtn" 
                        class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 focus:outline-none w-6 h-6 flex items-center justify-center"
                    >
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </form>
            </div>

            <!-- アクションボタン -->
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button 
                    id="randomBtn" 
                    class="flex items-center gap-2 px-3.5 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-full text-xs font-medium transition duration-200"
                    title="おまかせ表示（ランダム記事）"
                >
                    <i class="fa-solid fa-shuffle text-xs"></i>
                    <span>おまかせ記事</span>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
        <!-- 初期状態 / 検索前の状態 -->
        <div id="welcomeState" class="text-center py-16 px-4">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 mb-6">
                <i class="fa-solid fa-globe text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">知りたい情報を検索してみましょう</h2>
            <p class="text-slate-500 dark:text-slate-400 max-w-md mx-auto mb-8 text-sm leading-relaxed">
                Wikipediaの膨大な知識データベースから記事を探すことができます。気になるキーワードを入力するか、人気のキーワードを選択してください。
            </p>
            
            <!-- トレンドキーワード例 -->
            <div class="flex flex-wrap items-center justify-center gap-2 max-w-lg mx-auto">
                <span class="text-xs font-semibold text-slate-400 dark:text-slate-500 mr-1">例:</span>
                <button class="tag-btn bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-300 dark:hover:border-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400 text-slate-600 dark:text-slate-300 text-xs px-3 py-1.5 rounded-full shadow-sm transition">人工知能</button>
                <button class="tag-btn bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-300 dark:hover:border-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400 text-slate-600 dark:text-slate-300 text-xs px-3 py-1.5 rounded-full shadow-sm transition">宇宙探査</button>
                <button class="tag-btn bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-300 dark:hover:border-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400 text-slate-600 dark:text-slate-300 text-xs px-3 py-1.5 rounded-full shadow-sm transition">日本の歴史</button>
                <button class="tag-btn bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-300 dark:hover:border-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400 text-slate-600 dark:text-slate-300 text-xs px-3 py-1.5 rounded-full shadow-sm transition">量子力学</button>
            </div>
        </div>

        <!-- ローディング状態 -->
        <div id="loadingState" class="hidden text-center py-20">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 dark:border-indigo-400 border-t-transparent mb-4"></div>
            <p class="text-slate-500 dark:text-slate-400 text-sm">検索中...</p>
        </div>

        <!-- エラー状態 -->
        <div id="errorState" class="hidden text-center py-16">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-50 dark:bg-red-950/40 text-red-500 dark:text-red-400 mb-4">
                <i class="fa-solid fa-circle-exclamation text-2xl"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-200 mb-1" id="errorMessage">エラーが発生しました</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm">ネットワーク接続を確認するか、しばらく経ってから再度お試しください。</p>
        </div>

        <!-- 検索結果件数表示 -->
        <div id="resultMeta" class="hidden mb-6 flex items-center justify-between">
            <p class="text-xs font-medium text-slate-500 dark:text-slate-400" id="resultCount">検索結果</p>
        </div>

        <!-- 検索結果グリッド -->
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 検索結果アイテムがJSで追加されます -->
        </div>

        <!-- 件数ゼロの状態 -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 mb-4">
                <i class="fa-solid fa-magnifying-glass-minus text-2xl"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-200 mb-1">一致する記事が見つかりませんでした</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm">別のキーワードや、より一般的な単語で検索してみてください。</p>
        </div>
    </main>

    <!-- モーダル詳細ビュー -->
    <div id="articleModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-fade-in border border-slate-200 dark:border-slate-700">
            <!-- モーダルヘッダー -->
            <div class="p-4 border-b border-slate-100 dark:border-slate-700/80 flex items-center justify-between bg-slate-50/50 dark:bg-slate-800/50">
                <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/60 px-2.5 py-1 rounded-md">Wikipedia プレビュー</span>
                <button id="closeModalBtn" class="w-8 h-8 rounded-full text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-700 transition flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <!-- モーダルコンテンツ -->
            <div class="p-6 overflow-y-auto space-y-4" id="modalContent">
                <h2 id="modalTitle" class="text-2xl font-bold text-slate-900 dark:text-white"></h2>
                <div id="modalImageContainer" class="hidden my-4 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-900 max-h-64 flex justify-center items-center border border-slate-100 dark:border-slate-700">
                    <img id="modalImage" class="object-cover max-h-64 w-full" src="" alt="記事画像">
                </div>
                <div id="modalExtract" class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed whitespace-pre-line"></div>
            </div>

            <!-- モーダルフッター -->
            <div class="p-4 border-t border-slate-100 dark:border-slate-700/80 bg-slate-50/50 dark:bg-slate-800/50 flex items-center justify-between">
                <button id="modalCloseBottom" class="px-4 py-2 text-slate-600 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-slate-700 rounded-lg text-sm font-medium transition">
                    閉じる
                </button>
                <a id="modalExternalLink" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white rounded-lg text-sm font-medium shadow-sm transition">
                    <span>Wikipediaで続きを読む</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- フッター -->
    <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-6 mt-auto transition-colors duration-200">
        <div class="max-w-5xl mx-auto px-4 text-center text-xs text-slate-400 dark:text-slate-500">
            <p>データ提供: <a href="https://www.wikipedia.org/" target="_blank" rel="noopener" class="underline hover:text-slate-600 dark:hover:text-slate-300">Wikipedia API</a></p>
        </div>
    </footer>

    <!-- スクリプト部 -->
    <script>
        // Wikipedia API エンドポイント (日本語版)
        const WIKI_API_URL = 'https://ja.wikipedia.org/w/api.php';

        // DOM要素の取得
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const randomBtn = document.getElementById('randomBtn');
        const logoBtn = document.getElementById('logoBtn');
        
        const welcomeState = document.getElementById('welcomeState');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const emptyState = document.getElementById('emptyState');
        const errorMessage = document.getElementById('errorMessage');
        
        const resultsGrid = document.getElementById('resultsGrid');
        const resultMeta = document.getElementById('resultMeta');
        const resultCount = document.getElementById('resultCount');

        const articleModal = document.getElementById('articleModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalCloseBottom = document.getElementById('modalCloseBottom');
        const modalTitle = document.getElementById('modalTitle');
        const modalExtract = document.getElementById('modalExtract');
        const modalImage = document.getElementById('modalImage');
        const modalImageContainer = document.getElementById('modalImageContainer');
        const modalExternalLink = document.getElementById('modalExternalLink');

        // イベントリスナーの登録
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (query) {
                performSearch(query);
            }
        });

        // 入力フォームクリアボタン
        searchInput.addEventListener('input', () => {
            if (searchInput.value.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            searchInput.focus();
        });

        // ロゴクリックで初期状態に戻る
        logoBtn.addEventListener('click', resetToWelcome);

        // トレンドタグクリック時の検索
        document.querySelectorAll('.tag-btn').forEach(button => {
            button.addEventListener('click', () => {
                const term = button.textContent;
                searchInput.value = term;
                clearBtn.classList.remove('hidden');
                performSearch(term);
            });
        });

        // ランダム記事検索
        randomBtn.addEventListener('click', fetchRandomArticle);

        // モーダルを閉じる
        closeModalBtn.addEventListener('click', closeModal);
        modalCloseBottom.addEventListener('click', closeModal);
        articleModal.addEventListener('click', (e) => {
            if (e.target === articleModal) {
                closeModal();
            }
        });

        // ESCキーでモーダルを閉じる
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !articleModal.classList.contains('hidden')) {
                closeModal();
            }
        });

        // 初期表示にリセット
        function resetToWelcome() {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            welcomeState.classList.remove('hidden');
            loadingState.classList.add('hidden');
            errorState.classList.add('hidden');
            emptyState.classList.add('hidden');
            resultsGrid.classList.add('hidden');
            resultMeta.classList.add('hidden');
            resultsGrid.innerHTML = '';
        }

        // 表示状態の切り替えヘルパー
        function showState(state) {
            welcomeState.classList.add('hidden');
            loadingState.classList.add('hidden');
            errorState.classList.add('hidden');
            emptyState.classList.add('hidden');
            resultsGrid.classList.add('hidden');
            resultMeta.classList.add('hidden');

            if (state === 'loading') loadingState.classList.remove('hidden');
            if (state === 'error') errorState.classList.remove('hidden');
            if (state === 'empty') emptyState.classList.remove('hidden');
            if (state === 'results') {
                resultsGrid.classList.remove('hidden');
                resultMeta.classList.remove('hidden');
            }
        }

        // Wikipedia検索の実行
        async function performSearch(query) {
            showState('loading');

            const params = new URLSearchParams({
                action: 'query',
                generator: 'search',
                gsrsearch: query,
                gsrlimit: '15',
                prop: 'pageimages|extracts',
                exintro: '1',
                explaintext: '1',
                exsentences: '3',
                piprop: 'thumbnail',
                pithumbsize: '400',
                format: 'json',
                origin: '*'
            });

            try {
                const response = await fetch(`${WIKI_API_URL}?${params.toString()}`);
                if (!response.ok) {
                    throw new Error('ネットワーク応答が正常ではありませんでした');
                }
                
                const data = await response.json();

                if (!data.query || !data.query.pages) {
                    showState('empty');
                    return;
                }

                const pages = Object.values(data.query.pages);
                pages.sort((a, b) => a.index - b.index);

                displayResults(pages, query);
            } catch (err) {
                console.error('Wikipedia APIエラー:', err);
                errorMessage.textContent = 'データの取得中にエラーが発生しました';
                showState('error');
            }
        }

        // 検索結果の表示処理
        function displayResults(pages, query) {
            resultsGrid.innerHTML = '';
            resultCount.textContent = `「${query}」の検索結果 (${pages.length}件)`;

            pages.forEach((page, i) => {
                const title = page.title;
                const extract = page.extract || '詳細な説明はありません。';
                const thumbnail = page.thumbnail ? page.thumbnail.source : null;
                const pageUrl = `https://ja.wikipedia.org/?curid=${page.pageid}`;

                const card = document.createElement('div');
                card.className = 'group bg-white dark:bg-slate-800 rounded-xl border border-slate-200/80 dark:border-slate-700 shadow-sm hover:shadow-md hover:border-slate-300 dark:hover:border-slate-600 transition duration-200 overflow-hidden flex flex-col cursor-pointer animate-fade-in';
                card.style.animationDelay = `${i * 0.05}s`;

                card.innerHTML = `
                    ${thumbnail ? `
                        <div class="h-40 w-full overflow-hidden bg-slate-100 dark:bg-slate-900 border-b border-slate-100 dark:border-slate-700">
                            <img src="${thumbnail}" alt="${title}" class="w-full h-full object-cover transition hover:scale-105 duration-300" loading="lazy" onerror="this.style.display='none'">
                        </div>
                    ` : ''}
                    <div class="p-5 flex-1 flex flex-col">
                        <h3 class="text-base font-bold text-slate-900 dark:text-white mb-2 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition">
                            ${escapeHtml(title)}
                        </h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-3 mb-4 flex-1 leading-relaxed">
                            ${escapeHtml(extract)}
                        </p>
                        <div class="flex items-center justify-between pt-2 border-t border-slate-50 dark:border-slate-700/60 text-xs text-indigo-600 dark:text-indigo-400 font-medium">
                            <span>詳細を見る</span>
                            <i class="fa-solid fa-chevron-right text-[10px] group-hover:translate-x-0.5 transition-transform"></i>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    openModal(title, extract, thumbnail, pageUrl, page.pageid);
                });

                resultsGrid.appendChild(card);
            });

            showState('results');
        }

        // おまかせ表示（ランダム記事取得）
        async function fetchRandomArticle() {
            showState('loading');

            const params = new URLSearchParams({
                action: 'query',
                generator: 'random',
                grnnamespace: '0',
                grnlimit: '1',
                prop: 'pageimages|extracts',
                exintro: '1',
                explaintext: '1',
                piprop: 'thumbnail',
                pithumbsize: '600',
                format: 'json',
                origin: '*'
            });

            try {
                const response = await fetch(`${WIKI_API_URL}?${params.toString()}`);
                const data = await response.json();

                if (data.query && data.query.pages) {
                    const page = Object.values(data.query.pages)[0];
                    const pageUrl = `https://ja.wikipedia.org/?curid=${page.pageid}`;
                    const thumbnail = page.thumbnail ? page.thumbnail.source : null;
                    
                    searchInput.value = page.title;
                    clearBtn.classList.remove('hidden');
                    
                    displayResults([page], page.title);
                    openModal(page.title, page.extract || '概要はありません。', thumbnail, pageUrl, page.pageid);
                } else {
                    showState('empty');
                }
            } catch (err) {
                console.error('ランダム取得エラー:', err);
                showState('error');
            }
        }

        // 記事詳細モーダルの表示と追加情報の取得
        async function openModal(title, initialExtract, thumbnail, url, pageid) {
            modalTitle.textContent = title;
            modalExtract.textContent = initialExtract;
            modalExternalLink.href = url;

            if (thumbnail) {
                modalImage.src = thumbnail;
                modalImageContainer.classList.remove('hidden');
            } else {
                modalImageContainer.classList.add('hidden');
            }

            articleModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            try {
                const params = new URLSearchParams({
                    action: 'query',
                    prop: 'extracts',
                    pageids: pageid,
                    explaintext: '1',
                    exintro: '1',
                    format: 'json',
                    origin: '*'
                });
                const response = await fetch(`${WIKI_API_URL}?${params.toString()}`);
                const data = await response.json();
                
                if (data.query && data.query.pages && data.query.pages[pageid]) {
                    const fullExtract = data.query.pages[pageid].extract;
                    if (fullExtract) {
                        modalExtract.textContent = fullExtract;
                    }
                }
            } catch (e) {
                console.warn('詳細テキストの追加取得に失敗しました:', e);
            }
        }

        function closeModal() {
            articleModal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        // HTMLエスケープ処理
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
